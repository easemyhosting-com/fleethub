version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /cliproxy
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ['*']
