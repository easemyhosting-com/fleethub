name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:hygiene
      - run: npm run check:dependencies
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  dependencies:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
  container:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag fleethub:ci .
      - name: Check production HTTP behavior
        run: |
          docker run -d --name fleethub-ci -p 127.0.0.1:3000:3000 fleethub:ci
          trap 'docker rm -f fleethub-ci' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 60 --max-time 5 http://127.0.0.1:3000/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/fleet)" = "401"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: fleethub:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          format: json
          output: ${{ runner.temp }}/trivy-image.json
          exit-code: '1'
      - name: Report image finding counts only
        if: always()
        run: python3 scripts/scan-summary.py trivy "$RUNNER_TEMP/trivy-image.json"
  secrets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scanners: secret
          scan-ref: .
          format: json
          output: ${{ runner.temp }}/trivy-secrets.json
          exit-code: '1'
      - name: Report secret finding counts only
        if: always()
        run: python3 scripts/scan-summary.py trivy "$RUNNER_TEMP/trivy-secrets.json"
  inventory:
    permissions:
      contents: read
    name: ${{ matrix.timezone == 'UTC' && 'inventory' || format('inventory ({0})', matrix.timezone) }}
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Kolkata, America/Los_Angeles]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: ci-local
          POSTGRES_DB: fleethub_security
          TZ: ${{ matrix.timezone }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d fleethub_security"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: ${{ matrix.timezone }}
      AUTH_DATABASE_INTEGRATION: 'true'
      DATABASE_INTEGRATION: 'true'
      FLEETHUB_SEED_DEMO_DATA: 'false'
      DATABASE_URL: postgres://review:ci-local@127.0.0.1:5432/fleethub_security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify database timezone coverage
        run: |
          node --input-type=module <<'JS'
          import postgres from 'postgres';
          const sql = postgres(process.env.DATABASE_URL);
          try {
            const [row] = await sql`SELECT current_setting('TimeZone') AS timezone`;
            if (row.timezone !== process.env.TZ) throw new Error('Database timezone does not match the test matrix');
          } finally {
            await sql.end();
          }
          JS
      - run: npx vitest run --coverage --reporter=dot --fileParallelism=false
      - run: npm run build:worker
      - run: npm run build:mcp
