x-logging: &logging
  driver: local
  options: {max-size: 10m, max-file: "2"}

x-low-write-postgres: &low-write-postgres
  - postgres
  - -c
  - checkpoint_timeout=15min
  - -c
  - wal_compression=on

services:
  fleetdeck-db:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    command: *low-write-postgres
    logging: *logging
    environment:
      POSTGRES_USER: fleethub
      POSTGRES_PASSWORD: ${FLEETHUB_DB_PASSWORD:?Run the local setup helper or set a database password}
      POSTGRES_DB: fleethub
    volumes:
      # PostgreSQL 18 keeps its cluster in a version subdirectory of this mount.
      - fleetdeck_pg18_20261119:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleethub -d fleethub"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  fleetdeck:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3060:3000"
    environment:
      DATABASE_URL: postgres://fleethub:${FLEETHUB_DB_PASSWORD:?Set a database password}@fleetdeck-db:5432/fleethub
      NODE_ENV: production
      FLEETHUB_LOCAL_MODE: ${FLEETHUB_LOCAL_MODE:-true}
      FLEETHUB_DEV_ALLOW_ANONYMOUS_WRITE: ${FLEETHUB_DEV_ALLOW_ANONYMOUS_WRITE:-false}
      FLEETHUB_API_KEY: ${FLEETHUB_API_KEY:-}
      FLEETHUB_OBSERVATION_KEY: ${FLEETHUB_OBSERVATION_KEY:-}
      FLEETHUB_READONLY_KEY: ${FLEETHUB_READONLY_KEY:-}
      FLEETHUB_AUTH_REQUIRED: ${FLEETHUB_AUTH_REQUIRED:-true}
      FLEETHUB_AUTH_SECRET: ${FLEETHUB_AUTH_SECRET:?Run the local setup helper or set a session secret}
      FLEETHUB_BOOTSTRAP_TOKEN: ${FLEETHUB_BOOTSTRAP_TOKEN:-}
      FLEETHUB_SECRET_STORE_KEY: ${FLEETHUB_SECRET_STORE_KEY:-}
      FLEETHUB_APP_URL: ${FLEETHUB_APP_URL:-http://localhost:3060}
      FLEETHUB_GOOGLE_AUTH_ENABLED: ${FLEETHUB_GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FLEETHUB_GITHUB_APP_CLIENT_ID: ${FLEETHUB_GITHUB_APP_CLIENT_ID:-}
      FLEETHUB_GITHUB_APP_CLIENT_SECRET: ${FLEETHUB_GITHUB_APP_CLIENT_SECRET:-}
      FLEETHUB_ALLOWED_EMAILS: ${FLEETHUB_ALLOWED_EMAILS:-}
      FLEETHUB_TRUST_PROXY_AUTH: ${FLEETHUB_TRUST_PROXY_AUTH:-false}
      FLEETHUB_ALLOWED_ORIGINS: ${FLEETHUB_ALLOWED_ORIGINS:-}
      FLEETHUB_DEVICE_PAIRING: ${FLEETHUB_DEVICE_PAIRING:-}
      FLEETHUB_PAIRING_QR: ${FLEETHUB_PAIRING_QR:-}
      FLEETHUB_PAIRING_MAX_SCOPE: ${FLEETHUB_PAIRING_MAX_SCOPE:-}
      FLEETHUB_PROXY_AUTH_SECRET: ${FLEETHUB_PROXY_AUTH_SECRET:-}
      INFISICAL_URL: ${INFISICAL_URL:-http://infisical:8080}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      TAILSCALE_API_TOKEN: ${TAILSCALE_API_TOKEN:-}
      TAILSCALE_API_AUTH: ${TAILSCALE_API_AUTH:-basic}
      TAILSCALE_DEVICE_ID: ${TAILSCALE_DEVICE_ID:-}
      TAILSCALE_STATUS_FILE: /run/fleethub/tailscale-status.json
      FLEETHUB_RUNTIME_ENV_FILE: /run/fleethub/runtime/runtime.env
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:-}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:-}
      FLEETHUB_ALLOW_INSECURE_SERVICE_HTTP: ${FLEETHUB_ALLOW_INSECURE_SERVICE_HTTP:-false}
      FLEETHUB_ONBOARDING_ALLOWED_ORIGINS: ${FLEETHUB_ONBOARDING_ALLOWED_ORIGINS:-http://infisical:8080,http://cli-proxy-api:8317}
    volumes:
      - ${TAILSCALE_STATUS_PATH:-./scripts/tailscale-status.empty.json}:/run/fleethub/tailscale-status.json:ro
      - ${FLEETHUB_RUNTIME_DIR:-./scripts/runtime-empty}:/run/fleethub/runtime:ro
    depends_on:
      fleetdeck-db:
        condition: service_healthy
    mem_limit: 512m

  inventory-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "inventory-worker.mjs"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgres://fleethub:${FLEETHUB_DB_PASSWORD:?Set a database password}@fleetdeck-db:5432/fleethub
      NODE_ENV: production
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      FLEETHUB_ALLOW_INSECURE_SERVICE_HTTP: ${FLEETHUB_ALLOW_INSECURE_SERVICE_HTTP:-false}
      FLEETHUB_ONBOARDING_ALLOWED_ORIGINS: ${FLEETHUB_ONBOARDING_ALLOWED_ORIGINS:-http://infisical:8080,http://cli-proxy-api:8317}
      FLEETHUB_SECRET_STORE_KEY: ${FLEETHUB_SECRET_STORE_KEY:-}
      FLEETHUB_RUNTIME_ENV_FILE: /run/fleethub/runtime/runtime.env
    volumes:
      - ${FLEETHUB_RUNTIME_DIR:-./scripts/runtime-empty}:/run/fleethub/runtime:ro
    depends_on:
      fleetdeck-db:
        condition: service_healthy
    mem_limit: 256m

  # One-shot: hands the gateway volumes to the non-root runtime user, including volumes
  # written by the earlier root-run image. No network; only CHOWN and directory traversal.
  cli-proxy-api-volumes:
    profiles: [cliproxy, integrations]
    build:
      context: ./cliproxy
      dockerfile: Dockerfile
      args:
        CLIPROXY_IMAGE: ${CLIPROXY_IMAGE:-eceasy/cli-proxy-api:latest@sha256:3f74ca56cba8bea2a2a096a215bb774482d87d257da04c5047e6046493bfd644}
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging
    entrypoint:
      - sh
      - -c
      - >-
        for id in "$$0" "$$1"; do
        case "$$id" in ''|*[!0-9]*) echo "CLIPROXY_UID and CLIPROXY_GID must be numeric" >&2; exit 64;; esac;
        [ "$$id" -ne 0 ] || { echo "CLIPROXY_UID and CLIPROXY_GID must not be root" >&2; exit 64; };
        done;
        find /volumes/auth /volumes/logs /volumes/plugins -xdev \( ! -user "$$0" -o ! -group "$$1" \) -exec chown -h "$$0:$$1" {} +
    command: ["${CLIPROXY_UID:-10001}", "${CLIPROXY_GID:-10001}"]
    volumes:
      - cliproxy_auth:/volumes/auth
      - cliproxy_logs:/volumes/logs
      - cliproxy_plugins:/volumes/plugins
    mem_limit: 64m

  cli-proxy-api:
    # integrations is the explicit legacy option for starting both service stacks.
    profiles: [cliproxy, integrations]
    build:
      context: ./cliproxy
      dockerfile: Dockerfile
      args:
        CLIPROXY_IMAGE: ${CLIPROXY_IMAGE:-eceasy/cli-proxy-api:latest@sha256:3f74ca56cba8bea2a2a096a215bb774482d87d257da04c5047e6046493bfd644}
    # Run as the owner of the config file: the proxy reads it and rewrites hashed keys into it.
    user: "${CLIPROXY_UID:-10001}:${CLIPROXY_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      cli-proxy-api-volumes:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:8085:8085"
    volumes:
      - ${CLIPROXY_CONFIG_PATH:-./cliproxy/config.yaml}:/CLIProxyAPI/config.yaml
      - cliproxy_auth:/root/.cli-proxy-api
      - cliproxy_logs:/CLIProxyAPI/logs
      - cliproxy_plugins:/CLIProxyAPI/plugins
    mem_limit: 512m

  infisical-db:
    profiles: [infisical, integrations]
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    command: *low-write-postgres
    logging: *logging
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:-}
      POSTGRES_DB: infisical
    volumes:
      - infisical_pg18_20261119:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # Valkey is RESP-compatible with Redis; Infisical's queues and cache behave the same
  # on it (verified against the previous redis:7 image). REDIS_URL is unchanged.
  infisical-redis:
    profiles: [infisical, integrations]
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  infisical:
    profiles: [infisical, integrations]
    image: ${INFISICAL_IMAGE:-infisical/infisical:latest@sha256:cb971a75043b6fafdc738e9ca6d4f8a09b4f979a60b2b9ade39af5e095bcc5fb}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-}
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8088}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD:-}@infisical-db:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    # First boot on an empty database peaks near 870 MiB during migrations. A kill at 1 GiB can
    # leave infisical_migrations_lock.is_locked = 1, and later boots then fail with "Migration
    # table is already locked". On a disposable database only: stop infisical, set is_locked = 0,
    # start it again.
    mem_limit: 2048m

volumes:
  # Fresh PostgreSQL 18 volumes, restored from the PostgreSQL 16 dumps; see docs/69-postgresql-18-upgrade.md.
  # The PostgreSQL 16 volumes (fleetdeck_pg_data, infisical_pg_data) are no longer declared.
  # They still exist on the host; this change does not delete them.
  fleetdeck_pg18_20261119:
  infisical_pg18_20261119:
  cliproxy_auth:
  cliproxy_logs:
  cliproxy_plugins:
